[package]
name = "llrs-morton"
version = "0.1.0"
edition = "2024"
authors = ["c1ph3rc4t"]
categories = []
description = "Description"
homepage = "https://github.com/c1ph3rc4t/llrs-morton"
keywords = []
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/c1ph3rc4t/llrs-morton"

[build-dependencies]
cc = "1.10.0"

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = true, features = [
    "user-hooks",
] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
perf = "warn"
unwrap_used = "warn"
expect_used = "warn"
redundant_type_annotations = "warn"

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = "fat"
panic = "unwind"
incremental = false
codegen-units = 1
rpath = false

[profile.min-size]
inherits = "release"
opt-level = "z"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
